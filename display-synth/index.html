<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Pixel Flow Display Synth</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="display" aria-label="PatternFlow-compatible virtual LED display"></canvas>
  <div class="warning">Photosensitivity warning</div>
  <div class="hint">H controls · F fullscreen · Space pause · ←/→ pattern · M texture</div>

  <section class="panel" id="panel" aria-label="Pattern controls">
    <div class="brand">
      <div class="brand-row"><strong>Pixel Flow Display Synth</strong><span class="status" id="status">Loading official patterns…</span></div>
      <select class="pattern-select" id="pattern" aria-label="Pattern"></select>
      <div class="meta" id="meta"></div>
    </div>

    <div class="control" data-knob="0">
      <div class="control-head"><label for="knob0">Knob 1</label><output id="out0">0.50</output><button class="press" type="button">Push</button></div>
      <input id="knob0" type="range" min="0" max="1" step="0.001" value="0.5" />
    </div>
    <div class="control" data-knob="1">
      <div class="control-head"><label for="knob1">Knob 2</label><output id="out1">0.50</output><button class="press" type="button">Push</button></div>
      <input id="knob1" type="range" min="0" max="1" step="0.001" value="0.5" />
    </div>
    <div class="control" data-knob="2">
      <div class="control-head"><label for="knob2">Knob 3</label><output id="out2">0.50</output><button class="press" type="button">Push</button></div>
      <input id="knob2" type="range" min="0" max="1" step="0.001" value="0.5" />
    </div>
    <div class="control" data-knob="3">
      <div class="control-head"><label for="knob3">Knob 4</label><output id="out3">0.50</output><button class="press" type="button">Push</button></div>
      <input id="knob3" type="range" min="0" max="1" step="0.001" value="0.5" />
    </div>

    <div class="actions">
      <select id="texture" aria-label="Display texture">
        <option value="led" selected>Round LED</option>
        <option value="hybrid">Rounded Pixel</option>
        <option value="pixel">Pixel Art</option>
      </select>
      <button id="previous" type="button">Previous</button>
      <button id="next" type="button">Next</button>
      <button id="lessGlow" type="button">Glow −</button>
      <button id="moreGlow" type="button">Glow +</button>
      <button id="fullscreen" type="button">Fullscreen</button>
      <button id="reload" type="button">Reload Library</button>
    </div>
  </section>

  <script src="fallback-patterns.js"></script>
  <script src="app.js"></script>
</body>
</html>
